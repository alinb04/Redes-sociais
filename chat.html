<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Connect - Chat</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f4f8;
    }

    .app {
        width: 100%;
        max-width: 600px;
        height: 100vh;
        margin: auto;
        background: white;
        display: flex;
        flex-direction: column;
    }

    /* CABEÇALHO */

    .header {
        height: 70px;
        background: white;
        border-bottom: 1px solid #ddd;

        display: flex;
        align-items: center;

        padding: 10px 20px;

        gap: 15px;
    }

    .voltar {
        text-decoration: none;
        color: #222;
        font-size: 28px;
    }

    .foto {
        width: 45px;
        height: 45px;

        border-radius: 50%;

        background: #e8eef7;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 24px;
    }

    .usuario h3 {
        font-size: 16px;
    }

    .usuario p {
        color: #28a745;
        font-size: 12px;
        margin-top: 3px;
    }


    /* CHAT */

    .chat {

        flex: 1;

        padding: 20px;

        overflow-y: auto;

        background: #f2f4f8;

        display: flex;

        flex-direction: column;

        gap: 10px;

    }


    /* MENSAGENS */

    .mensagem {

        max-width: 75%;

        padding: 10px 14px;

        border-radius: 15px;

        font-size: 15px;

    }

    .recebida {

        background: white;

        align-self: flex-start;

        border-bottom-left-radius: 4px;

    }

    .enviada {

        background: #1877f2;

        color: white;

        align-self: flex-end;

        border-bottom-right-radius: 4px;

    }

    .hora {

        display: block;

        font-size: 10px;

        margin-top: 5px;

        opacity: 0.6;

        text-align: right;

    }


    /* ÁREA DE DIGITAR */

    .campo {

        height: 70px;

        padding: 10px;

        border-top: 1px solid #ddd;

        display: flex;

        gap: 10px;

        background: white;

    }

    .campo input {

        flex: 1;

        border: none;

        background: #f2f4f8;

        border-radius: 25px;

        padding: 0 18px;

        font-size: 15px;

        outline: none;

    }

    .campo button {

        width: 50px;

        height: 50px;

        border: none;

        border-radius: 50%;

        background: #1877f2;

        color: white;

        font-size: 20px;

        cursor: pointer;

    }

</style>
```

</head>

<body>

<div class="app">

```
<!-- CABEÇALHO -->

<div class="header">

    <a href="mensagens.html" class="voltar">
        ←
    </a>

    <div class="foto">
        👨
    </div>

    <div class="usuario">

        <h3>
            João Silva
        </h3>

        <p>
            online
        </p>

    </div>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

    <div class="mensagem recebida">

        Oi! Tudo bem?

        <span class="hora">
            14:30
        </span>

    </div>


    <div class="mensagem enviada">

        Oi! Tudo sim 😊

        <span class="hora">
            14:31
        </span>

    </div>


    <div class="mensagem recebida">

        O que você está fazendo?

        <span class="hora">
            14:32
        </span>

    </div>

</div>


<!-- DIGITAR -->

<div class="campo">

    <input
        type="text"
        id="mensagem"
        placeholder="Digite uma mensagem..."
    >

    <button onclick="enviar()">
        ➤
    </button>

</div>
```

</div>

<script>

function enviar() {

    const input =
        document.getElementById("mensagem");

    const texto =
        input.value.trim();


    if (texto === "") {

        return;

    }


    const chat =
        document.getElementById("chat");


    const novaMensagem =
        document.createElement("div");


    novaMensagem.className =
        "mensagem enviada";


    const agora =
        new Date();


    const hora =
        agora.getHours()
        .toString()
        .padStart(2, "0")
        +
        ":" +
        agora.getMinutes()
        .toString()
        .padStart(2, "0");


    novaMensagem.innerHTML =
        texto +
        '<span class="hora">' +
        hora +
        '</span>';


    chat.appendChild(
        novaMensagem
    );


    input.value = "";


    chat.scrollTop =
        chat.scrollHeight;

}


/* ENTER ENVIA */

document
    .getElementById("mensagem")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                enviar();

            }

        }
    );

</script>

</body>

</html>
