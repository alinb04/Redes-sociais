<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Notificações</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="app">

    <header>

        <a href="usuario.html" class="back">
            ←
        </a>

        <h2>Notificações</h2>

    </header>

    <main class="notifications">

        <div class="notification-item">

            <div class="avatar">👤</div>

            <div>
                <strong>João Silva</strong>
                <p>Enviou uma nova mensagem para você.</p>
                <small>há 2 minutos</small>
            </div>

        </div>

        <div class="notification-item">

            <div class="avatar">👩</div>

            <div>
                <strong>Maria Santos</strong>
                <p>Começou a seguir você.</p>
                <small>há 10 minutos</small>
            </div>

        </div>

        <div class="notification-item">

            <div class="avatar">👨</div>

            <div>
                <strong>Pedro Oliveira</strong>
                <p>Enviou uma nova mensagem.</p>
                <small>há 30 minutos</small>
            </div>

        </div>

        <div class="notification-item">

            <div class="avatar">👩‍💻</div>

            <div>
                <strong>Julia Costa</strong>
                <p>Curtiram sua publicação.</p>
                <small>há 1 hora</small>
            </div>

        </div>

    </main>

</div>


</body>
</html>
