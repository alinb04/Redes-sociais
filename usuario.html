    </h1>


    <!-- USUÁRIO -->

    <p class="username" id="username">
        @...
    </p>

    <!-- BOTÃO EDITAR -->

    <button
        onclick="editarPerfil()"
        class="editar">

    </button>


    <!-- OPÇÕES -->

    <div class="menu">


        <a href="mensagens.html" class="menu-link">

<span class="menu-icon">

<div class="menu-text">

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>

let usuarioAtual = null;

async function carregarPerfil() {

    const user = await exigirLogin();
    if (!user) return;

    usuarioAtual = user;

    const { data: perfil, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error || !perfil) {
        document.getElementById("nome").textContent = "Perfil não encontrado";
        return;
    }

    document.getElementById("avatar").textContent = perfil.avatar || "👤";
    document.getElementById("nome").textContent = perfil.nome;
    document.getElementById("username").textContent = "@" + perfil.username;
    document.getElementById("bio").textContent = perfil.bio || "";
}

async function editarPerfil() {

    const { data: perfil } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", usuarioAtual.id)
        .single();

    const novoNome = prompt("Nome:", perfil.nome);
    if (novoNome === null) return;

    const novaBio = prompt("Bio:", perfil.bio || "");
    if (novaBio === null) return;

    const { error } = await supabaseClient
        .from("profiles")
        .update({ nome: novoNome, bio: novaBio })
        .eq("id", usuarioAtual.id);

    if (error) {
        alert("Erro ao salvar: " + error.message);
        return;
    }

    carregarPerfil();
}

async function sair() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
}

carregarPerfil();

</script>

</body>

</html>
