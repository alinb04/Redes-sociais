<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Conversa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- CABEÇALHO -->

    <header class="chat-header">

        <a href="mensagens.html" class="back">
            ←
        </a>

        <div class="chat-user">

            <div class="chat-avatar" id="avatar">
                👤
            </div>

            <div>
                <strong id="nomeUsuario">
                    Usuário
                </strong>
            </div>

        </div>

    </header>


    <!-- MENSAGENS -->

    <main class="chat" id="chat">

    </main>


    <!-- ÁREA DE ENVIO -->

    <div class="message-input">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
        >

        <button onclick="enviarMensagem()">
            ➤
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>

const parametros = new URLSearchParams(window.location.search);
const outroId = parametros.get("usuario");

let meuId = null;

async function iniciar() {

    const user = await exigirLogin();
    if (!user) return;

    meuId = user.id;

    if (!outroId) {
        window.location.href = "mensagens.html";
        return;
    }

    // Carrega o perfil da outra pessoa pro cabeçalho
    const { data: perfil } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", outroId)
        .single();

    if (!perfil) {
        window.location.href = "mensagens.html";
        return;
    }

    document.getElementById("nomeUsuario").textContent = perfil.nome;
    document.getElementById("avatar").textContent = perfil.avatar || "👤";

    await carregarMensagens();
    escutarNovasMensagens();

    document
        .getElementById("mensagem")
        .addEventListener("keydown", function (event) {
            if (event.key === "Enter") enviarMensagem();
        });
}

async function carregarMensagens() {

    const { data: mensagens, error } = await supabaseClient
        .from("messages")
        .select("*")
        .or(
            `and(sender_id.eq.${meuId},receiver_id.eq.${outroId}),` +
            `and(sender_id.eq.${outroId},receiver_id.eq.${meuId})`
        )
        .order("created_at", { ascending: true });

    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    if (error) {
        chat.innerHTML = `<p style="padding:20px; color:#e0245e;">Erro ao carregar mensagens: ${error.message}</p>`;
        return;
    }

    (mensagens || []).forEach(desenharMensagem);

    chat.scrollTop = chat.scrollHeight;
}

function desenharMensagem(mensagem) {

    const chat = document.getElementById("chat");

    const tipo = mensagem.sender_id === meuId ? "enviada" : "recebida";

    const hora = new Date(mensagem.created_at)
        .toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    const div = document.createElement("div");
    div.classList.add("message", tipo);

    div.innerHTML = `
        <p></p>
        <small>${hora}</small>
    `;
    div.querySelector("p").textContent = mensagem.content;

    chat.appendChild(div);
}

async function enviarMensagem() {

    const campo = document.getElementById("mensagem");
    const texto = campo.value.trim();

    if (texto === "") return;

    campo.value = "";

    const { data, error } = await supabaseClient
        .from("messages")
        .insert({
            sender_id: meuId,
            receiver_id: outroId,
            content: texto
        })
        .select()
        .single();

    if (error) {
        alert("Erro ao enviar: " + error.message);
        campo.value = texto; // devolve o texto pro campo, já que não foi enviado
        return;
    }

    // Desenha a própria mensagem na hora, sem depender do realtime
    // (o realtime continua sendo usado para receber mensagens da outra pessoa).
    desenharMensagem(data);
    const chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}

function escutarNovasMensagens() {

    supabaseClient
        .channel("chat-" + [meuId, outroId].sort().join("-"))
        .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "messages" },
            (payload) => {

                const msg = payload.new;

                // Mensagens que eu mesmo enviei já são desenhadas na hora
                // em enviarMensagem() — aqui só tratamos as que eu recebo.
                if (msg.sender_id === meuId) return;

                const ehDestaConversa =
                    (msg.sender_id === outroId && msg.receiver_id === meuId);

                if (!ehDestaConversa) return;

                desenharMensagem(msg);

                const chat = document.getElementById("chat");
                chat.scrollTop = chat.scrollHeight;
            }
        )
        .subscribe();
}

iniciar();

</script>

</body>

</html>
